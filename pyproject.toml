[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-spacetime"
version = "0.1.0"
description = "A computational investigation of Einstein-Rosen bridges, singularities, holography, quantum branching, time reversal and quantum-gravity models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "qutip>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = ["jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running numerical experiments"]
